<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="#top" aria-label="Ahmad Alshaib — back to top">
      <span class="site-header__mark" aria-hidden="true">AA</span>
      <span class="site-header__name">Ahmad Alshaib</span>
    </a>

    <nav
      id="primary-navigation"
      class="site-header__nav"
      [class.site-header__nav--open]="mobileMenuOpen()"
      aria-label="Primary navigation"
    >
      @for (link of links; track link.targetId) {
        <a
          class="site-header__nav-link"
          [attr.href]="'#' + link.targetId"
          [attr.aria-current]="activeSection() === link.targetId ? 'location' : null"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="site-header__theme-toggle"
        [attr.aria-label]="themeLabel()"
        [attr.title]="themeLabel()"
        (click)="toggleTheme()"
      >
        <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '◐' }}</span>
      </button>

      @if (content.resume.available) {
        <a
          class="site-header__resume"
          [href]="content.resume.path"
          download="Ahmad-Alshaib-Web-Engineer-Resume.pdf"
        >
          Resume
        </a>
      }

      <button
        type="button"
        class="site-header__menu-toggle"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="mobileMenuOpen()"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
