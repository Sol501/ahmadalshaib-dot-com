<app-section-heading
  title="Skills"
  eyebrow="Capabilities"
  description="Tools, frameworks, and practices I rely on to ship dependable frontend"
/>
<div class="skills-grid">
  @for (group of skillGroups(); track group.id; let last = $last) {
    <article class="skills-card" [class.skills-card--full]="last && (skillGroups().length % 2 === 1)">
      <h3 class="skills-card__title">
        @if (group.icon) {
          <app-icon
            [name]="group.icon"
            size="18"
            [ariaLabel]="group.label + ' icon'" />
        }
        <span>{{ group.label }}</span>
      </h3>
      <ul class="skills-card__chips">
        @for (skill of group.skills; track skill.id) {
          <li class="skills-card__chip">
            <app-icon
              [name]="skill.icon ?? 'check'"
              size="14"
              [ariaLabel]="skill.name + ' icon'" />
            <span>{{ skill.name }}</span>
          </li>
        }
      </ul>
    </article>
  }
  @empty {
    <p class="section-placeholder">Skill groups will be curated soon.</p>
  }
</div>
