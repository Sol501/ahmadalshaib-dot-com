<app-section-heading
  title="Skills"
  eyebrow="Technical focus"
  description="Verified technologies and practices used to build, modernize, and support production frontend systems."
/>

<div class="skills-list">
  @for (group of skillGroups; track group.id) {
    <section class="skills-group" [class.skills-group--primary]="group.primary">
      <h3>{{ group.title }}</h3>
      <ul>
        @for (skill of group.skills; track skill) {
          <li [class.skills-group__angular]="skill === 'Angular'">{{ skill }}</li>
        }
      </ul>
    </section>
  }
</div>
