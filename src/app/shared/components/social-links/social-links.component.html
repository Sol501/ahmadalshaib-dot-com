<nav class="social-links" aria-label="Social profiles">
  @for (link of links; track link.id) {
    <a
      class="social-links__item"
      [attr.href]="link.url"
      target="_blank"
      rel="noreferrer noopener"
      [attr.aria-label]="link.label"
      [attr.title]="link.label"
    >
      <app-icon
        class="social-links__icon"
        [name]="link.type"
        size="20" />
    </a>
  }
</nav>
